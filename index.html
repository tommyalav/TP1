<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudTask v1.2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif
        }

        :root {
            --blue: #166534;
            --cyan: #0891b2;
            --ink: #16332c;
            --muted: #55736b;
            --line: #d4e5df;
            --panel: #f3faf7;
            --green-deep: #102a24;
            --green-mid: #1f493c;
            --mint: #34d399
        }

        body {
            background: linear-gradient(135deg, #eef8ff, #f7fbfd);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--ink)
        }

        .app {
            width: 100%;
            max-width: 920px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, .10);
            overflow: hidden
        }

        .header {
            background: linear-gradient(135deg, var(--cyan), var(--blue));
            color: #fff;
            padding: 28px;
            text-align: center
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px
        }

        .header p {
            opacity: .94
        }

        .version {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, .18)
        }

        .content {
            padding: 26px
        }

        input,
        select,
        button {
            font-size: 15px
        }

        input[type=text],
        input[type=date],
        select {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #fff;
            color: var(--ink)
        }

        button {
            cursor: pointer;
            transition: filter .15s, transform .15s
        }

        button:hover {
            filter: brightness(.96)
        }

        button:active {
            transform: translateY(1px)
        }

        .input-group {
            display: grid;
            gap: 10px;
            margin-bottom: 20px
        }

        .primary-btn {
            border: 0;
            border-radius: 10px;
            background: var(--cyan);
            color: #fff;
            padding: 12px 18px;
            font-weight: bold
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            flex-wrap: wrap
        }

        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .filter-btn {
            border: 0;
            background: #e5e7eb;
            color: #374151;
            padding: 9px 14px;
            border-radius: 20px
        }

        .filter-btn.active {
            background: var(--blue);
            color: #fff
        }

        .clear-btn {
            border: 0;
            background: #fff7ed;
            color: #c2410c;
            padding: 9px 14px;
            border-radius: 20px;
            font-weight: bold
        }

        .task-list {
            list-style: none
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 10px
        }

        .task-left {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            min-width: 0
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0
        }

        .task-text {
            overflow-wrap: anywhere
        }

        .task.completed .task-text {
            text-decoration: line-through;
            color: #9ca3af
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0
        }

        .delete-btn,
        .edit-btn {
            border: 0;
            padding: 8px 12px;
            border-radius: 8px
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626
        }

        .edit-btn {
            background: #e0f2fe;
            color: #0369a1
        }

        .priority,
        .date-badge,
        .overdue-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold
        }

        .priority-baja {
            background: #dcfce7;
            color: #166534
        }

        .priority-media {
            background: #fef3c7;
            color: #92400e
        }

        .priority-alta {
            background: #fee2e2;
            color: #b91c1c
        }

        .date-badge {
            background: #e0f2fe;
            color: #075985
        }

        .overdue-badge {
            background: #fee2e2;
            color: #b91c1c
        }

        .meta {
            display: flex;
            gap: 7px;
            flex-wrap: wrap
        }

        .task.overdue {
            border-left: 5px solid #dc2626
        }

        .summary {
            margin-top: 22px;
            display: grid;
            gap: 12px
        }

        .summary-card {
            background: #eff6ff;
            color: #1e3a8a;
            padding: 14px;
            border-radius: 10px;
            text-align: center
        }

        .summary-card strong {
            display: block;
            font-size: 24px;
            margin-top: 5px
        }

        .empty {
            text-align: center;
            color: #9ca3af;
            padding: 25px
        }

        footer {
            border-top: 1px solid var(--line);
            padding: 17px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.7
        }

        .student {
            font-weight: bold;
            color: #374151
        }

        @media(min-width:600px) {
            .v10-input {
                grid-template-columns: 1fr auto
            }

            .v11-input {
                grid-template-columns: 1fr 170px auto
            }

            .v12-input {
                grid-template-columns: minmax(180px, 1fr) 145px 155px auto
            }

            .summary.two {
                grid-template-columns: 1fr 1fr
            }

            .summary.three {
                grid-template-columns: repeat(3, 1fr)
            }
        }

        @media(max-width:599px) {
            body {
                padding: 12px
            }

            .header {
                padding: 23px 16px
            }

            .header h1 {
                font-size: 27px
            }

            .content {
                padding: 18px
            }

            .task {
                align-items: stretch;
                flex-direction: column
            }

            .task .actions {
                justify-content: flex-end
            }

            .toolbar {
                align-items: flex-start
            }

            .summary {
                grid-template-columns: 1fr
            }
        }

        /* Paleta CloudTask: verde tecnológico + cian/turquesa */
        body {
            background: linear-gradient(135deg, #e8f7f1 0%, #f6fcfa 55%, #e6f5f4 100%);
            color: var(--ink)
        }

        .app {
            border: 1px solid rgba(31, 73, 60, .08);
            border-radius: 22px;
            box-shadow: 0 18px 48px rgba(16, 42, 36, .12)
        }

        .header {
            background: linear-gradient(125deg, #102a24 0%, #1f493c 58%, #087f8c 100%);
        }

        .primary-btn {
            background: #087f8c;
            color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(8, 127, 140, .16)
        }

        .primary-btn:hover {
            background: #066875;
            filter: none
        }

        .filter-btn {
            background: #e7f0ec;
            color: #23483d;
            border: 1px solid #d5e4dd
        }

        .filter-btn.active {
            background: #166534;
            color: #fff;
            border-color: #166534
        }

        .clear-btn {
            background: #fff1e9;
            color: #a33d1d;
            border: 1px solid #ffddcb
        }

        input[type=text],
        input[type=date],
        select {
            border-color: #c8dcd4;
            border-radius: 12px;
            outline-color: #0891b2
        }

        input[type=text]:focus,
        input[type=date]:focus,
        select:focus {
            border-color: #0891b2;
            box-shadow: 0 0 0 3px rgba(8, 145, 178, .14);
            outline: none
        }

        input[type=checkbox] {
            accent-color: #0891b2
        }

        .task {
            background: linear-gradient(110deg, #f7fcf9, #f0f8f5);
            border-color: #d9e9e2;
            border-radius: 16px;
            transition: border-color .15s, box-shadow .15s
        }

        .task:hover {
            border-color: #a8d7c7;
            box-shadow: 0 4px 14px rgba(31, 73, 60, .06)
        }

        .delete-btn {
            background: #fff0ef;
            color: #b4232e;
            border: 1px solid #ffd8d5;
            border-radius: 10px
        }

        .edit-btn {
            background: #dff7f7;
            color: #086779;
            border: 1px solid #b8e9e8;
            border-radius: 10px
        }

        .date-badge {
            background: #dff7f7;
            color: #075e68
        }

        .summary-card {
            background: linear-gradient(135deg, #e0f7ec, #dff7f7);
            color: #164e3e;
            border: 1px solid #c6e9dc;
            border-radius: 16px
        }

        footer {
            border-top-color: #dcebe5;
            color: #55736b
        }

        .student {
            color: #164e3e
        }

        .empty {
            color: #66877c
        }

        @media(prefers-reduced-motion:reduce) {

            button,
            .task {
                transition: none
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <header class="header">
            <h1>☁ CloudTask</h1>
            <p>Gestor de tareas interactivo</p><span class="version">Versión 1.2</span>
        </header>
        <section class="content">
            <form id="taskForm" class="input-group v12-input">
                <input id="taskInput" type="text" maxlength="160" placeholder="Escribe una nueva tarea..."
                    aria-label="Nombre de la tarea" required>
                <select id="prioritySelect" aria-label="Prioridad">
                    <option value="baja">Prioridad baja</option>
                    <option value="media" selected>Prioridad media</option>
                    <option value="alta">Prioridad alta</option>
                </select>
                <input id="dueDateInput" type="date" aria-label="Fecha límite">
                <button id="addTaskBtn" class="primary-btn" type="submit">Agregar</button>
            </form>
            <div class="input-group v12-input" style="grid-template-columns:minmax(180px,1fr) 180px">
                <input id="searchInput" type="text" placeholder="Buscar tareas..." aria-label="Buscar tareas">
                <select id="sortSelect" aria-label="Ordenar tareas">
                    <option value="default">Orden original</option>
                    <option value="priority">Por prioridad</option>
                    <option value="date">Por fecha límite</option>
                </select>
            </div>
            <div class="toolbar">
                <div class="filters" aria-label="Filtros de tareas"><button class="filter-btn active" type="button"
                        data-filter="all">Todas</button><button class="filter-btn" type="button"
                        data-filter="pending">Pendientes</button><button class="filter-btn" type="button"
                        data-filter="completed">Completadas</button></div><button id="clearCompletedBtn"
                    class="clear-btn" type="button">Eliminar completadas</button>
            </div>
            <ul id="taskList" class="task-list" aria-live="polite"></ul>
            <div class="summary three">
                <div class="summary-card">Total<strong id="totalCount">0</strong></div>
                <div class="summary-card">Pendientes<strong id="pendingCount">0</strong></div>
                <div class="summary-card">Vencidas<strong id="overdueCount">0</strong></div>
            </div>
        </section>
        <footer>CloudTask v1.2 · GitHub + Vercel / Netlify<br><span class="student">Estudiante: Julio Tommy Álava
                Rodríguez</span></footer>
    </main>
    <script>
        const STORAGE_KEY = "cloudTaskTasks";
        const taskInput = document.getElementById("taskInput"), prioritySelect = document.getElementById("prioritySelect"), dueDateInput = document.getElementById("dueDateInput"), taskForm = document.getElementById("taskForm"), taskList = document.getElementById("taskList");
        const totalCount = document.getElementById("totalCount"), pendingCount = document.getElementById("pendingCount"), overdueCount = document.getElementById("overdueCount"), searchInput = document.getElementById("searchInput"), sortSelect = document.getElementById("sortSelect"), addTaskBtn = document.getElementById("addTaskBtn"), filterButtons = [...document.querySelectorAll(".filter-btn")];
        let currentFilter = "all", editingId = null;
        const defaults = [
            { id: 1, text: "Subir proyecto a GitHub", completed: false, priority: "alta", dueDate: "" },
            { id: 2, text: "Desplegar aplicación en Vercel", completed: false, priority: "media", dueDate: "" },
            { id: 3, text: "Probar aplicación desde el teléfono", completed: true, priority: "baja", dueDate: "" }];
        function loadTasks() { try { const saved = localStorage.getItem(STORAGE_KEY); if (saved === null) return defaults; const parsed = JSON.parse(saved); if (!Array.isArray(parsed)) return defaults; return parsed.filter(t => t && typeof t.text === "string").map((t, i) => ({ id: Number.isFinite(t.id) ? t.id : Date.now() + i, text: t.text, completed: Boolean(t.completed), priority: ["baja", "media", "alta"].includes(t.priority) ? t.priority : "media", dueDate: typeof t.dueDate === "string" ? t.dueDate : "" })); } catch (error) { return defaults; } }
        let tasks = loadTasks();
        function saveTasks() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (error) { console.warn("No se pudieron guardar las tareas en este navegador.", error); } }
        function isOverdue(task) { if (!task.dueDate || task.completed) return false; const today = new Date(); today.setHours(0, 0, 0, 0); const due = new Date(task.dueDate + "T00:00:00"); return !Number.isNaN(due.getTime()) && due < today; }
        function renderTasks() {
            taskList.replaceChildren(); let visible = [...tasks];
            if (currentFilter === "pending") visible = visible.filter(t => !t.completed); if (currentFilter === "completed") visible = visible.filter(t => t.completed);
            const query = searchInput.value.trim().toLocaleLowerCase("es"); if (query) visible = visible.filter(t => t.text.toLocaleLowerCase("es").includes(query));
            const priorityOrder = { alta: 1, media: 2, baja: 3 };
            if (sortSelect.value === "priority") visible.sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);
            if (sortSelect.value === "date") visible.sort((a, b) => { if (!a.dueDate && !b.dueDate) return 0; if (!a.dueDate) return 1; if (!b.dueDate) return -1; return a.dueDate.localeCompare(b.dueDate); });
            if (!visible.length) { const empty = document.createElement("li"); empty.className = "empty"; empty.textContent = "No hay tareas para mostrar"; taskList.append(empty); }
            const labels = { baja: "Baja", media: "Media", alta: "Alta" };
            visible.forEach(task => {
                const li = document.createElement("li"); li.className = "task" + (task.completed ? " completed" : "") + (isOverdue(task) ? " overdue" : "");
                const left = document.createElement("div"); left.className = "task-left";
                const checkbox = document.createElement("input"); checkbox.type = "checkbox"; checkbox.checked = task.completed; checkbox.setAttribute("aria-label", "Marcar tarea como completada"); checkbox.addEventListener("change", () => toggleTask(task.id));
                const info = document.createElement("div"); info.className = "task-info";
                const text = document.createElement("span"); text.className = "task-text"; text.textContent = task.text;
                const meta = document.createElement("div"); meta.className = "meta";
                const priority = document.createElement("span"); priority.className = "priority priority-" + task.priority; priority.textContent = "Prioridad " + labels[task.priority]; meta.append(priority);
                if (task.dueDate) { const date = document.createElement("span"); date.className = "date-badge"; date.textContent = "Fecha: " + task.dueDate; meta.append(date); }
                if (isOverdue(task)) { const overdue = document.createElement("span"); overdue.className = "overdue-badge"; overdue.textContent = "Vencida"; meta.append(overdue); }
                info.append(text, meta); left.append(checkbox, info);
                const actions = document.createElement("div"); actions.className = "actions";
                const edit = document.createElement("button"); edit.type = "button"; edit.className = "edit-btn"; edit.textContent = "Editar"; edit.addEventListener("click", () => editTask(task.id));
                const del = document.createElement("button"); del.type = "button"; del.className = "delete-btn"; del.textContent = "Eliminar"; del.addEventListener("click", () => deleteTask(task.id));
                actions.append(edit, del); li.append(left, actions); taskList.append(li);
            });
            totalCount.textContent = tasks.length; pendingCount.textContent = tasks.filter(t => !t.completed).length; overdueCount.textContent = tasks.filter(isOverdue).length; saveTasks();
        }
        function resetForm() { taskInput.value = ""; prioritySelect.value = "media"; dueDateInput.value = ""; editingId = null; addTaskBtn.textContent = "Agregar"; }
        function addOrUpdateTask(event) {
            event.preventDefault(); const text = taskInput.value.trim(); if (!text) { alert("Escribe una tarea."); return; } const priority = prioritySelect.value, dueDate = dueDateInput.value;
            if (editingId !== null) { tasks = tasks.map(t => t.id === editingId ? { ...t, text, priority, dueDate } : t); } else { tasks.push({ id: Date.now(), text, completed: false, priority, dueDate }); }
            resetForm(); renderTasks(); taskInput.focus();
        }
        function editTask(id) { const task = tasks.find(t => t.id === id); if (!task) return; taskInput.value = task.text; prioritySelect.value = task.priority; dueDateInput.value = task.dueDate || ""; editingId = id; addTaskBtn.textContent = "Guardar"; taskInput.focus(); }
        function toggleTask(id) { tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t); renderTasks(); }
        function deleteTask(id) { tasks = tasks.filter(t => t.id !== id); if (editingId === id) resetForm(); renderTasks(); }
        function clearCompletedTasks() { if (!tasks.some(t => t.completed)) { alert("No hay tareas completadas."); return; } if (confirm("¿Eliminar todas las tareas completadas?")) { tasks = tasks.filter(t => !t.completed); if (editingId !== null && !tasks.some(t => t.id === editingId)) resetForm(); renderTasks(); } }
        taskForm.addEventListener("submit", addOrUpdateTask); document.getElementById("clearCompletedBtn").addEventListener("click", clearCompletedTasks);
        searchInput.addEventListener("input", renderTasks); sortSelect.addEventListener("change", renderTasks);
        filterButtons.forEach(button => button.addEventListener("click", () => { filterButtons.forEach(b => b.classList.toggle("active", b === button)); currentFilter = button.dataset.filter; renderTasks(); }));
        renderTasks();
    </script>
</body>

</html>
